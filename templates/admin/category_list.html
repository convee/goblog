<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>分类管理 - goblog</title>
    <link href="{{.cdn}}/admin/css/styles.css" rel="stylesheet"/>
    <script src="{{.cdn}}/admin/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
<nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
    <!-- Navbar Brand-->
    <a class="navbar-brand ps-3" href="/admin">{{.name}}</a>
    <!-- Sidebar Toggle-->
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" type="button" aria-label="展开或收起侧边栏"><i
            class="fas fa-bars" aria-hidden="true"></i></button>
    <form class="ms-auto me-3" method="POST" action="/admin/logout">
        <input type="hidden" name="_csrf" value="{{.csrf_token}}">
        <button class="btn btn-outline-light" type="submit">退出登录</button>
    </form>
</nav>
<div id="layoutSidenav">
    <div id="layoutSidenav_nav">
        <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
            <div class="sb-sidenav-menu">
                <div class="nav">
                    <div class="sb-sidenav-menu-heading">Golang博客系统</div>
                    <a class="nav-link" href="/admin">
                        <div class="sb-nav-link-icon"></div>
                        文章列表
                    </a>
                    <a class="nav-link" href="/admin/page">
                        <div class="sb-nav-link-icon"></div>
                        页面列表
                    </a>
                    <a class="nav-link" href="/admin/category">
                        <div class="sb-nav-link-icon"></div>
                        分类列表
                    </a>
                    <a class="nav-link" href="/admin/tag">
                        <div class="sb-nav-link-icon"></div>
                        标签列表
                    </a>
                </div>
            </div>
        </nav>
    </div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">分类列表</h1>

                <div class="card mb-4">
                    <div class="card-header">
                        <a class="navbar-brand" href="/admin/category/add">添加分类</a>
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>分类</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            {{range .categories}}
                            <tr>
                                <td>{{.Id}}</td>
                                <td>{{.Name}}</td>
                                <td><a class="btn btn-sm btn-outline-primary" href="/admin/category/add?id={{.Id}}">编辑</a>
                                    <form class="d-inline" method="POST" action="/admin/category/delete" data-confirm="确定删除这个分类吗？">
                                        <input type="hidden" name="_csrf" value="{{$.csrf_token}}"><input type="hidden" name="id" value="{{.Id}}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                                    </form>
                                </td>
                            </tr>
                            {{end}}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="{{.cdn}}/admin/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="{{.cdn}}/admin/js/scripts.js"></script>
<script src="{{.cdn}}/admin/js/simple-datatables.js" crossorigin="anonymous"></script>
<script src="{{.cdn}}/admin/js/datatables-simple-demo.js"></script>
</body>
</html>
