<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑文章 - goblog</title>
    <link rel="stylesheet" href="{{.cdn}}/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{.cdn}}/md/css/editormd.css"/>
    <link rel="stylesheet" href="{{.cdn}}/css/admin-editor.css"/>
</head>
<body>
<main class="admin-editor">
    <header class="admin-editor__header">
        <h1>{{if .id}}编辑文章{{else}}添加文章{{end}}</h1>
        <a class="btn btn-default" href="/admin">返回列表</a>
    </header>
    <form action="/admin/post/save" method="POST">
        <input type="hidden" name="_csrf" value="{{.csrf_token}}">
        <input type="hidden" name="id" value="{{.id}}">
        <div class="form-group">
            <label for="post-title">标题</label>
            <input id="post-title" class="form-control" type="text" name="title" value="{{.title}}" maxlength="200" required autofocus>
        </div>
        <div class="form-group">
            <label for="post-category">分类</label>
            <select id="post-category" class="form-control" name="category" required>
                {{range .categories}}<option value="{{.Id}}" {{if eq .Id .Cur}}selected{{end}}>{{.Name}}</option>{{end}}
            </select>
        </div>
        <div class="form-group">
            <label for="post-tags">标签</label>
            <input id="post-tags" class="form-control" type="text" name="tags" value="{{.tags}}" aria-describedby="post-tags-help">
            <small id="post-tags-help" class="admin-editor__help">多个标签用英文逗号分隔，最多 20 个。</small>
        </div>
        <div class="form-group">
            <label for="post-description">摘要</label>
            <textarea id="post-description" class="form-control" name="description" maxlength="2000">{{.description}}</textarea>
        </div>
        <div id="test-editormd" data-editor-path="{{.cdn}}/md/lib/">
            <textarea style="display:none;" name="content">{{.content}}</textarea>
        </div>
        <div class="admin-editor__actions">
            <button class="btn btn-primary" type="submit">保存</button>
            <a class="btn btn-default" href="/admin">取消</a>
        </div>
    </form>
</main>
<script src="{{.cdn}}/md/js/jquery.min.js"></script>
<script src="{{.cdn}}/md/editormd.min.js"></script>
<script src="{{.cdn}}/js/editor.js"></script>
</body>
</html>
