<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{.title}}|{{.name}}</title>
    <meta name="keywords" content="{{.keywords}}"/>
    <meta name="description" content="{{.description}}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="{{.cdn}}/css/bootstrap.min.css?v={{.asset_version}}"/>
    <link rel="stylesheet" href="{{.cdn}}/css/style.css?v={{.asset_version}}">
    <link rel="stylesheet" href="{{.cdn}}/md/css/editormd.preview.css?v={{.asset_version}}"/>
</head>

<body>
<a class="skip-link" href="#main-content">跳到正文</a>
<header>
    <nav class="navbar navbar-default" id="navbar">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                        data-target="#header-navbar" aria-controls="header-navbar" aria-expanded="false">
                    <span class="sr-only">展开导航</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <h1 class="logo">
                    <a href="/">{{.name}}</a>
                </h1>
            </div>
            <div class="collapse navbar-collapse" id="header-navbar">
                {{if .show_nav_search}}
                <form class="navbar-form nav navbar-form navbar-right search-nav" action="/" method="GET" role="search">
                    <div class="input-group">
                        <label class="sr-only" for="site-search">搜索文章</label>
                        <input id="site-search" type="search" name="keyword" class="form-control" placeholder="搜索文章"
                               maxlength="100" value="{{.keyword}}" autocomplete="off">
                        {{if .category_id}}<input type="hidden" name="category_id" value="{{.category_id}}">{{end}}
                        {{if .tag_id}}<input type="hidden" name="tag_id" value="{{.tag_id}}">{{end}}
                        {{if .per_page}}<input type="hidden" name="per_page" value="{{.per_page}}">{{end}}
                        <span class="input-group-btn">
                                <button type="submit" class="btn btn-default btn-search">搜索</button>
                            </span>
                    </div>
                </form>
                {{end}}
                <ul class="nav navbar-nav navbar-left">
                    {{range .navigation}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
                </ul>
            </div>
        </div>
    </nav>
</header>
<main id="main-content">
{{template "content" .}}
</main>
<div class="footer">
    <div class="container">
        <p>&copy; {{.year}} {{.name}}</p>
    </div>
</div>

<script src="{{.cdn}}/js/site.js?v={{.asset_version}}"></script>
</body>

</html>
