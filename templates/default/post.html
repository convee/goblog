{{define "content"}}
<div class="container">
    <div class="content-wrap">
        <div class="content">
            <header class="article-header">
                <h1 class="article-title">{{.post.Title}}</h1>
                <div class="article-meta ">
                    <span class="item category"><a href="/?category_id={{.post.CategoryId}}">{{.post.CategoryName}}</a></span>
                    <span class="item time ">{{.post.UpdatedAt.Format "2006-01-02 15:04:05"}}</span>
                    <span class="item tags">
                            标签：
                            {{range .tags}}
                            <a href="/?tag_id={{.Id}}">{{.Name}}</a>
                            {{end}}
                        </span>
                    <span class="item views"><i class="glyphicon glyphicon-eye-open"></i> {{.post.Views}}</span>
                </div>
            </header>

            <article class="article-content editormd-preview-container">
                {{.content_html}}
            </article>
        </div>

    </div>
</div>
{{end}}
